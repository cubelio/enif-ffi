name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path smoke_test/Cargo.toml

  clippy:
    name: clippy (${{ matrix.features || 'floor' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The feature ladder is additive; testing each rung confirms every
        # cfg boundary compiles on its own.
        features: ["", "nif_2_16", "nif_2_17", "nif_2_18"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: |
          FEAT=""
          [ -n "${{ matrix.features }}" ] && FEAT="--features ${{ matrix.features }}"
          cargo clippy --all-targets $FEAT -- -D warnings

  docs:
    name: doc links
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features nif_2_18

  msrv:
    name: msrv (1.77)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.77"
      - uses: Swatinem/rust-cache@v2
      # The committed Cargo.lock is format v4 (Cargo 1.78+), which 1.77 can't
      # parse; drop it so 1.77 resolves its own. The code's real floor is the
      # `c"..."` literals (1.77) — the whole surface (top rung pulls in the
      # lower ones) compiles there.
      - run: rm -f Cargo.lock
      - run: cargo build --features nif_2_18

  smoke:
    name: smoke (OTP ${{ matrix.otp }}, NIF ${{ matrix.nif }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each OTP ships a fixed NIF version; build the smoke NIF with the
        # feature rung that OTP satisfies. The entry then advertises that
        # version and the loader dlsyms that rung's symbols (init resolves every
        # Api field and fails the load if one is missing) — so every rung is
        # load-tested end to end against a matching BEAM.
        #
        # No 2.15 floor row: setup-beam has no prebuilt OTP 22/23 for any
        # current Ubuntu runner (oldest is OTP 24). The floor is covered anyway
        # — its symbols are a subset of the 2.16 row's dlsym set (additive
        # ladder), and a 2.15 entry loading on a 2.15 BEAM is proven by the
        # windows OTP 22 lane (version negotiation is platform-independent).
        include:
          - { otp: "24", nif: "2.16", features: "--features enif-ffi/nif_2_16" }
          - { otp: "26", nif: "2.17", features: "--features enif-ffi/nif_2_17" }
          - { otp: "29", nif: "2.18", features: "--features enif-ffi/nif_2_18" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smoke_test
      - name: build the NIF and run it under the BEAM
        run: |
          cd smoke_test
          ERL_BIN="$(dirname "$(command -v erl)")" bash run.sh ${{ matrix.features }}

  smoke-windows:
    name: smoke (windows, OTP ${{ matrix.otp }}, NIF ${{ matrix.nif }})
    # windows-latest is now Windows Server 2025 (ImageOS win25-vs2026), which
    # the pinned setup-beam doesn't yet recognize; pin the stable 2022 image.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # On Windows the table is read by offset, so each rung appends slots
        # whose ordering is load-bearing; mirror the unix matrix to exercise
        # every rung's offsets against a matching BEAM.
        include:
          - { otp: "22", nif: "2.15", features: "" }
          - { otp: "24", nif: "2.16", features: "--features enif-ffi/nif_2_16" }
          - { otp: "26", nif: "2.17", features: "--features enif-ffi/nif_2_17" }
          - { otp: "29", nif: "2.18", features: "--features enif-ffi/nif_2_18" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smoke_test
      # The binding stores the BEAM-supplied callback table instead of dlsym;
      # this is the only thing that actually exercises that path. Git Bash is
      # present on the windows image, so the same run.sh works.
      - name: build the NIF and run it under the Windows BEAM
        shell: bash
        run: |
          cd smoke_test
          ERL_BIN="$(dirname "$(command -v erl)")" bash run.sh ${{ matrix.features }}
