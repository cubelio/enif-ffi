# Standalone behavioral smoke test: a hand-written NIF over enif-ffi, loaded
# into a real BEAM. Its own workspace so it doesn't perturb the library crate.
[package]
name = "smoke"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "smoke"
crate-type = ["cdylib"]

[dependencies]
enif-ffi = { path = ".." }

# Passthrough rungs mirroring enif-ffi's additive ladder. Building the smoke NIF
# at a rung both enables that rung on enif-ffi and turns on the matching cfg in
# this crate, so the version-gated NIFs are compiled and registered in lockstep
# with the symbols they call.
[features]
nif_2_16 = ["enif-ffi/nif_2_16"]
nif_2_17 = ["nif_2_16", "enif-ffi/nif_2_17"]
nif_2_18 = ["nif_2_17", "enif-ffi/nif_2_18"]

[workspace]
